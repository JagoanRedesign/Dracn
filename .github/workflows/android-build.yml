
name: Build Drama CN from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract Project ZIP
        run: |
          mkdir -p extracted
          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "File ZIP tidak ditemukan"
            exit 1
          fi

          unzip -q "$ZIP" -d extracted

          PROJECT=$(find extracted -name settings.gradle.kts \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "settings.gradle.kts tidak ditemukan"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT" >> $GITHUB_ENV
          echo "Project ditemukan: $PROJECT"

      - name: Build APK
        uses: gradle/actions/setup-gradle@v4

      - name: Compile APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Drama-CN-APK
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
