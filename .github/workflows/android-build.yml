
name: Build Drama CN APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK Environment
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/build-tools/35.0.0" >> $GITHUB_PATH

      - name: Install Android SDK Packages
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -name sdkmanager -type f | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager tidak ditemukan"
            exit 1
          fi

          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract Project ZIP
        run: |
          mkdir -p extracted

          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ZIP tidak ditemukan"
            exit 1
          fi

          unzip -q "$ZIP" -d extracted

          PROJECT=$(find extracted \
            -name settings.gradle.kts \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "settings.gradle.kts tidak ditemukan"
            find extracted -maxdepth 4 -type f
            exit 1
          fi

          if [ ! -f "$PROJECT/app/build.gradle.kts" ]; then
            echo "app/build.gradle.kts tidak ditemukan"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Project ditemukan: $PROJECT"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Check APK
        run: |
          find "$PROJECT_DIR/app/build/outputs/apk" \
            -name "*.apk" -type f

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Drama-CN-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
